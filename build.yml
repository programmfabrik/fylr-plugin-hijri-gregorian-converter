# Build configuration for fylr-build-plugin. Delivered files are listed
# EXPLICITLY here — nothing is derived from the manifest. The safety net is
# "check" (runs with every build): it validates the assembled build folder
# against every path manifest.yml references.

server:
  install:
    - l10n

webfrontend:
  # compiled + concatenated IN THIS ORDER into plugin.webfrontend.url
  # (webfrontend/hijri-gregorian-converter.js). The converter defines the
  # class the splitter uses, so it has to come first.
  coffee1:
    - webfrontend/HijriGregorianConverter.coffee
    - webfrontend/HijriGregorianConverterMaskSplitter.coffee

# The loca CSV is carried over from the easydb plugin as-is and has no Google
# Sheets master yet, so there is no "loca" section: `make loca` would have
# nothing to pull.
