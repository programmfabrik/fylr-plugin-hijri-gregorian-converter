<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" width="640" height="268" role="img"
     aria-label="fylr editor showing a Gregorian and a Hijri date field with two conversion buttons between them">
  <style>
    .lbl  { font: 600 12px "Helvetica Neue", Arial, sans-serif; fill: #3c3c3c; }
    .val  { font: 400 14px "Helvetica Neue", Arial, sans-serif; fill: #1a1a1a; }
    .ph   { font: 400 14px "Helvetica Neue", Arial, sans-serif; fill: #9b9b9b; }
    .btn  { font: 600 12px "Helvetica Neue", Arial, sans-serif; }
    .cap  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #8a8a8a; }
    .ttl  { font: 600 11px "Helvetica Neue", Arial, sans-serif; fill: #8a8a8a; letter-spacing: .08em; }
  </style>

  <rect width="640" height="268" fill="#ffffff"/>
  <rect x="16" y="14" width="608" height="240" rx="3" fill="#fafafa" stroke="#e2e2e2"/>
  <text class="ttl" x="32" y="38">HIJRI GREGORIAN CONVERTER</text>

  <!-- Gregorian field -->
  <text class="lbl" x="32" y="70">Datum (gregorianisch)</text>
  <rect x="32" y="78" width="576" height="34" rx="2" fill="#ffffff" stroke="#cccccc"/>
  <text class="val" x="44" y="100">1867-02-14</text>
  <g fill="#9b9b9b" transform="translate(578,88)">
    <rect x="0" y="2" width="14" height="13" rx="1.5" fill="none" stroke="#9b9b9b" stroke-width="1.3"/>
    <line x1="0" y1="6" x2="14" y2="6" stroke="#9b9b9b" stroke-width="1.3"/>
    <line x1="4" y1="0" x2="4" y2="3" stroke="#9b9b9b" stroke-width="1.3"/>
    <line x1="10" y1="0" x2="10" y2="3" stroke="#9b9b9b" stroke-width="1.3"/>
  </g>

  <!-- conversion buttons -->
  <g transform="translate(32,126)">
    <rect x="0" y="0" width="196" height="30" rx="2" fill="#ffffff" stroke="#b8b8b8"/>
    <text class="btn" x="98" y="20" text-anchor="middle" fill="#3c3c3c">⇄  Hijri &gt; Gregorianisch</text>
  </g>
  <g transform="translate(240,126)">
    <rect x="0" y="0" width="196" height="30" rx="2" fill="#f5f5f5" stroke="#dcdcdc"/>
    <text class="btn" x="98" y="20" text-anchor="middle" fill="#b0b0b0">⇄  Gregorianisch &gt; Hijri</text>
  </g>
  <text class="cap" x="446" y="146">deaktiviert – Zieldatum bereits gesetzt</text>

  <!-- Hijri field -->
  <text class="lbl" x="32" y="188">Datum (Hijri)</text>
  <rect x="32" y="196" width="576" height="34" rx="2" fill="#ffffff" stroke="#cccccc"/>
  <text class="ph" x="44" y="218">1283-10-09</text>
  <g fill="#9b9b9b" transform="translate(578,206)">
    <rect x="0" y="2" width="14" height="13" rx="1.5" fill="none" stroke="#9b9b9b" stroke-width="1.3"/>
    <line x1="0" y1="6" x2="14" y2="6" stroke="#9b9b9b" stroke-width="1.3"/>
    <line x1="4" y1="0" x2="4" y2="3" stroke="#9b9b9b" stroke-width="1.3"/>
    <line x1="10" y1="0" x2="10" y2="3" stroke="#9b9b9b" stroke-width="1.3"/>
  </g>
</svg>
